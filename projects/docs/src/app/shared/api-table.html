<div class="wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Type</th>
        <th scope="col">Default</th>
        <th scope="col">Description</th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.name) {
        <tr>
          <td>
            <code>{{ row.name }}</code>
          </td>
          <td>
            <code>{{ row.type }}</code>
          </td>
          <td>
            @if (row.default) {
              <code>{{ row.default }}</code>
            }
          </td>
          <td>{{ row.description }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
