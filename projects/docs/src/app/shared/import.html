<div class="import">
  <pre><code>{{ code() }}</code></pre>
  <button type="button" aria-label="Copy import code" (click)="copy()">
    <hy-icon [name]="result() === 'copied' ? 'check' : 'copy'" size="1.15rem" />
  </button>
  <span role="status">{{
    result() === 'copied'
      ? 'Import copied.'
      : result() === 'error'
        ? 'Copy failed. Select the import and copy it manually.'
        : ''
  }}</span>
</div>
