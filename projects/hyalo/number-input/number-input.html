<div class="control">
  <button
    type="button"
    aria-label="Decrease value"
    [disabled]="blocked() || (min() !== undefined && value() !== null && value()! <= min()!)"
    (click)="spin(-1)"
  >
    −
  </button>
  <input
    type="text"
    inputmode="decimal"
    role="spinbutton"
    [id]="id()"
    [name]="name()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || parseError() || null"
    [value]="draft()"
    [attr.aria-valuenow]="value() ?? null"
    [attr.aria-valuemin]="min() ?? null"
    [attr.aria-valuemax]="max() ?? null"
    [attr.aria-valuetext]="formatted() + ' ' + currencyLabel()"
    (input)="update($event)"
    (compositionend)="update($event)"
    (keydown)="arrows($event)"
  />
  @if (currencyLabel()) {
    <span aria-hidden="true">{{ currencyLabel() }}</span>
  }
  <button
    type="button"
    aria-label="Increase value"
    [disabled]="blocked() || (max() !== undefined && value() !== null && value()! >= max()!)"
    (click)="spin(1)"
  >
    +
  </button>
</div>
@if (parseError()) {
  <p class="message error" role="status">{{ validationError() }}</p>
}
