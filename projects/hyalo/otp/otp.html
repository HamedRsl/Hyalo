<input
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  dir="ltr"
  [id]="id()"
  [name]="name()"
  [disabled]="disabled()"
  [required]="required()"
  [readOnly]="readonly()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  [value]="value()"
  [attr.maxlength]="count()"
  [attr.pattern]="'[0-9]{' + count() + '}'"
  (paste)="paste($event)"
  (input)="update($event)"
  (compositionend)="update($event)"
/>
<p class="message">Enter {{ count() }} digits. You can paste the complete code.</p>
