<div class="control">
  <input
    type="search"
    [id]="id()"
    [name]="name()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
    [placeholder]="placeholder()"
    [value]="value()"
    [attr.aria-busy]="loading() || null"
    (input)="update($event)"
    (compositionend)="update($event)"
    (search)="submit($event)"
    (keydown.enter)="submit($event)"
  />
  @if (value()) {
    <button type="button" aria-label="Clear search" [disabled]="blocked()" (click)="clear()">
      Clear
    </button>
  }
</div>
@if (loading()) {
  <p class="message" role="status">Searching</p>
}
