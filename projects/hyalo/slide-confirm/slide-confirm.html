<div #track class="track" [attr.data-confirmed]="value()">
  <span aria-hidden="true">{{
    loading() ? loadingLabel() : value() ? completedLabel() : label() || confirmLabel()
  }}</span>
  <button
    #handle
    type="button"
    [id]="id()"
    [disabled]="disabled()"
    [attr.aria-disabled]="blocked() || loading() || value() || null"
    [attr.aria-label]="label() || confirmLabel()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-invalid]="showsError() || null"
    [attr.aria-busy]="loading() || null"
    (click)="confirm()"
  >
    <hy-icon [name]="value() ? 'check' : 'arrow-end'" />
  </button>
</div>
<span class="sr" role="status">{{ value() ? completedLabel() : '' }}</span>
@if (name()) {
  <input type="hidden" [name]="name()" [value]="value()" [disabled]="disabled()" />
}
