<input
  [id]="id()"
  [name]="name()"
  [attr.autocomplete]="autocomplete()"
  [type]="masked() ? 'password' : 'text'"
  [inputMode]="decimal() ? 'decimal' : 'numeric'"
  [value]="display()"
  [disabled]="disabled()"
  [readOnly]="readonly()"
  [required]="required()"
  [attr.aria-label]="label() || 'Amount'"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  (input)="edit($event)"
  (compositionend)="edit($event)"
  (keydown.enter)="enter($event)"
/>
<div class="keys" role="group" [attr.aria-label]="label() || 'Numeric keypad'">
  @for (key of keys(); track key.value) {
    <button type="button" [disabled]="blocked()" (click)="append(key.value)">
      {{ key.label }}
    </button>
  }
  @if (decimal()) {
    <button
      type="button"
      [disabled]="blocked()"
      [attr.aria-label]="decimalLabel()"
      (click)="append('.')"
    >
      {{ decimalSeparator() }}
    </button>
  } @else {
    <button type="button" [disabled]="blocked()" (click)="clear()">{{ clearLabel() }}</button>
  }
  <button type="button" [disabled]="blocked()" (click)="append('0')">
    {{ digits()[0]!.label }}
  </button>
  <button
    type="button"
    [disabled]="blocked()"
    [attr.aria-label]="backspaceLabel()"
    (click)="erase()"
  >
    <span aria-hidden="true">⌫</span>
  </button>
</div>
@if (allowNegative()) {
  <button type="button" [disabled]="blocked()" (click)="sign()">{{ signLabel() }}</button>
}
@if (submitLabel()) {
  <button type="button" class="submit" [disabled]="blocked() || !value()" (click)="submit()">
    {{ submitLabel() }}
  </button>
}
