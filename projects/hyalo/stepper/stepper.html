<nav [attr.aria-label]="label()">
  <ol>
    @for (step of steps(); track step; let i = $index) {
      <li>
        <button
          type="button"
          [id]="step.id"
          [disabled]="!available()[i]"
          [attr.aria-current]="activeIndex() === i ? 'step' : null"
          [attr.aria-controls]="step.id + '-panel'"
          (click)="select(i)"
          (keydown)="onKey($event, i)"
        >
          <span aria-hidden="true">{{ step.completed() ? '✓' : i + 1 }}</span
          >{{ step.label() }}
        </button>
      </li>
    }
  </ol>
</nav>
<ng-content />
