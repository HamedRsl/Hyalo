<div class="control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input
    type="text"
    ngCombobox
    #combobox="ngCombobox"
    autocomplete="off"
    [id]="id()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [required]="required()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
    [placeholder]="placeholder()"
    [value]="query() || (!expanded() ? selectedLabel() : '')"
    [expanded]="expanded()"
    (expandedChange)="expand($event)"
    (input)="type($event)"
    (compositionend)="type($event)"
  />
  <button
    type="button"
    [disabled]="blocked()"
    [attr.aria-expanded]="expanded()"
    aria-label="Show options"
    (click)="expand(!expanded()); focus()"
  >
    Options
  </button>
  @if (value() !== null) {
    <button type="button" aria-label="Clear selection" [disabled]="blocked()" (click)="clear()">
      Clear
    </button>
  }
</div>
@if (selectedLabel()) {
  <p class="message">Selected: {{ selectedLabel() }}</p>
}
<ng-template ngComboboxPopup [combobox]="combobox">
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="expanded()"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
    (overlayOutsideClick)="dismiss()"
    (detach)="dismiss()"
  >
    <div class="options">
      <!-- Aria forwards navigation from the input while focus stays on that input. -->
      <div
        ngComboboxWidget
        ngListbox
        #list="ngListbox"
        focusMode="activedescendant"
        selectionMode="explicit"
        [multi]="false"
        [disabled]="blocked()"
        [value]="selection()"
        (valueChange)="choose($event)"
        [activeDescendant]="list.activeDescendant()"
        [attr.aria-label]="label() || 'Options'"
        [attr.aria-busy]="busy() || null"
      >
        @for (item of results(); track item.key) {
          <div
            ngOption
            [value]="item.option.value"
            [label]="item.option.label"
            [disabled]="item.disabled"
          >
            {{ item.option.label }}
          </div>
        }
      </div>
      @if (busy()) {
        <p class="message" role="status">{{ loadingLabel() }}</p>
      } @else if (failed()) {
        <p class="message error" role="status">{{ errorLabel() }}</p>
        <button type="button" (click)="retry()">Retry</button>
      } @else if (!results().length) {
        <p class="message" role="status">{{ emptyLabel() }}</p>
      }
    </div>
  </ng-template>
</ng-template>
