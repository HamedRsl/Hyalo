<section class="split">
  <aside><ng-content select="[authAside]" /></aside>
  <form (submit)="send($event)" [attr.aria-busy]="pending()">
    <h2>{{ heading() }}</h2>
    <hy-field label="Email"
      ><input hyInput type="email" autocomplete="email" [formField]="f.email"
    /></hy-field>
    @if (verify()) {
      <hy-field label="Verification code"><hy-otp [formField]="f.code" /></hy-field>
    } @else {
      <hy-field label="Password">
        <input hyInput hyPassword #secret="hyPassword" [formField]="f.password" autocomplete="current-password" />
        <button hySuffix [hyPasswordToggle]="secret" aria-label="Show password"></button>
      </hy-field>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <button hyButton type="submit" [disabled]="pending()">
      {{ pending() ? 'Waiting' : verify() ? 'Verify code' : 'Sign in' }}
    </button>
    <ng-content />
  </form>
</section>
