<div class="shell" [style.--hy-dashboard-block-max-height]="maxHeight()">
  <aside><ng-content select="[hyBlockSidebar]" /></aside>
  <div
    class="main"
    [attr.tabindex]="maxHeight() ? 0 : null"
    [attr.role]="maxHeight() ? 'region' : null"
    [attr.aria-label]="maxHeight() ? contentLabel() : null"
  >
    <header><ng-content select="[hyBlockToolbar]" /></header>
    <ng-content />
  </div>
</div>
