<input
  type="range"
  [id]="id()"
  [name]="name()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [disabled]="blocked()"
  [min]="scale() ? 0 : min()"
  [max]="scale() ? 1 : max()"
  [step]="scale() ? 'any' : step()"
  [value]="position(value())"
  (input)="change($event)"
  (change)="commit()"
  (pointerdown)="startDrag($event)"
  (pointerup)="endDrag()"
  (pointercancel)="endDrag()"
  (lostpointercapture)="endDrag()"
  [style.writing-mode]="orientation() === 'vertical' ? 'vertical-lr' : null"
  [style.direction]="reversed() ? 'rtl' : 'ltr'"
  [attr.aria-orientation]="orientation()"
  [attr.aria-valuetext]="valueFormatter()(value())"
  [attr.list]="id() + '-marks'"
/>
@if (showValue()) { <output [attr.for]="id()">{{ valueFormatter()(value()) }}</output> }
<datalist [id]="id() + '-marks'">
  @for (tick of ticks(); track $index) { <option [value]="position(tick)"></option> }
  @for (mark of marks(); track $index) { <option [value]="position(mark.value)" [label]="mark.label"></option> }
</datalist>
