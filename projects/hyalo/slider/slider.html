<input
  type="range"
  [id]="id()"
  [name]="name()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [disabled]="blocked()"
  [min]="min()"
  [max]="max()"
  [step]="step()"
  [value]="value()"
  (input)="change($event)"
/>
<output [attr.for]="id()">{{ value() }}</output>
