<div
  class="cards"
  role="radiogroup"
  [attr.aria-label]="label() || 'Choose an option'"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  [attr.aria-required]="required() || null"
>
  @for (option of options(); track option.value; let first = $first) {
    <label class="card"
      ><input
        type="radio"
        [id]="first ? id() : id() + '-' + $index"
        [name]="name() || id()"
        [value]="option.value"
        [checked]="value() === option.value"
        [disabled]="blocked() || option.disabled"
        [required]="required()"
        (change)="choose($event)"
      />
      <span
        ><strong>{{ option.label }}</strong>
        @if (option.description) {
          <span class="description">{{ option.description }}</span>
        }
      </span></label
    >
  }
</div>
