<select
  class="hy-select__native"
  [hidden]="!useNative()"
  [id]="nativeId"
  [disabled]="disabled() || !useNative()"
  [required]="required()"
  [name]="useNative() ? name() : undefined"
  [attr.aria-describedby]="field?.describedBy() ?? null"
  [attr.aria-invalid]="showsError() || null"
  (change)="pickNative($event)"
  (blur)="touch.emit()"
>
  <option value="" [disabled]="required()" [selected]="!selectedOption()">
    {{ placeholder() }}
  </option>
  @for (group of groups(); track group.key) {
    @if (group.key) {
      <optgroup [label]="group.label">
        @for (item of group.options; track item.key) {
          <option
            [value]="item.key"
            [selected]="item.option.value === value()"
            [disabled]="item.disabled"
          >
            {{ item.option.label }}
          </option>
        }
      </optgroup>
    } @else {
      @for (item of group.options; track item.key) {
        <option
          [value]="item.key"
          [selected]="item.option.value === value()"
          [disabled]="item.disabled"
        >
          {{ item.option.label }}
        </option>
      }
    }
  }
</select>
<hy-icon [hidden]="!useNative()" class="hy-select__chevron" name="chevron-down" />
<button
  #trigger
  type="button"
  ngCombobox
  #combobox="ngCombobox"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  class="hy-select__trigger"
  [hidden]="useNative()"
  [id]="triggerId"
  [disabled]="disabled() || useNative()"
  [expanded]="expanded()"
  (expandedChange)="setExpanded($event)"
  [attr.aria-labelledby]="field ? field.labelId + ' ' + triggerId : null"
  [attr.aria-describedby]="field?.describedBy() ?? null"
  [attr.aria-invalid]="showsError() || null"
  [attr.aria-required]="required() || null"
  (blur)="touch.emit()"
>
  <span class="hy-select__value" [class.hy-select__placeholder]="!selectedOption()">{{
    selectedOption()?.label ?? placeholder()
  }}</span>
  <hy-icon class="hy-select__chevron" name="chevron-down" />
</button>
<ng-template ngComboboxPopup [combobox]="combobox">
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="rendered() && !useNative()"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayMinWidth]="panelWidth()"
    cdkConnectedOverlayPanelClass="hy-select-overlay"
    cdkConnectedOverlayTransformOriginOn=".hy-select__panel"
    (attach)="onAttach()"
    (overlayOutsideClick)="expanded.set(false)"
  >
    <!-- Focus remains on the combobox trigger while Aria manages the active option. -->
    <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
    <div
      ngComboboxWidget
      ngListbox
      #listbox="ngListbox"
      class="hy-select__panel hy-glass"
      data-material="frosted"
      focusMode="activedescendant"
      selectionMode="explicit"
      [activeDescendant]="listbox.activeDescendant()"
      [value]="listValue()"
      (valueChange)="pick($event)"
      (click)="onPanelClick($event)"
      (keydown.enter)="close()"
      (keydown.space)="close()"
    >
      @for (group of groups(); track group.key) {
        <div role="group" [attr.aria-label]="group.label || null">
          @if (group.label) {
            <div class="hy-select__group-label">{{ group.label }}</div>
          }
          @for (item of group.options; track item.key) {
            <div
              ngOption
              class="hy-select__option"
              [value]="item.option.value"
              [label]="item.option.label"
              [disabled]="item.disabled"
            >
              @if (optionTemplate(); as template) {
                <ng-container
                  [ngTemplateOutlet]="template"
                  [ngTemplateOutletContext]="item.context"
                />
              } @else {
                <span>{{ item.option.label }}</span>
              }
              <hy-icon class="hy-select__check" name="check" />
            </div>
          }
        </div>
      }
    </div>
  </ng-template>
</ng-template>
