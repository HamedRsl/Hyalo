<div #row class="hy-segmented__row">
  <span class="hy-segmented__indicator" aria-hidden="true"></span>
  @for (option of options(); track option.value) {
    <label
      #item
      class="hy-segmented__item"
      [attr.data-checked]="selected(option) || null"
    >
      <input
        [type]="multiple() ? 'checkbox' : 'radio'"
        class="hy-segmented__input"
        [name]="name() || groupName"
        [checked]="selected(option)"
        [disabled]="disabled() || !!option.disabled"
        (change)="choose(option)"
        (click)="clear($event, option)"
        (blur)="touch.emit()"
      />
      @if (optionTemplate(); as template) {
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ $implicit: option, selected: selected(option) }" />
      } @else {
      @if (option.icon; as icon) {
        <hy-icon [name]="icon" />
      }
      <span>{{ option.label }}</span>
      }
    </label>
  }
</div>
