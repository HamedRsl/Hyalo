@if (variant() === 'circle') {
  <svg viewBox="0 0 40 40" aria-hidden="true">
    @if (segmentCount() > 1) {
      <defs>
        <mask [attr.id]="segmentMaskId">
          <circle
            cx="20"
            cy="20"
            [attr.r]="radius()"
            fill="none"
            stroke="white"
            [attr.stroke-width]="stroke() + 1"
            stroke-linecap="butt"
            pathLength="100"
            [attr.stroke-dasharray]="segmentDash()"
          />
        </mask>
      </defs>
    }
    <g [attr.mask]="segmentCount() > 1 ? 'url(#' + segmentMaskId + ')' : null">
      <circle
        class="track"
        cx="20"
        cy="20"
        [attr.r]="radius()"
        [attr.stroke-width]="stroke()"
        [attr.stroke-linecap]="linecap()"
      />
      <circle
        class="fill"
        cx="20"
        cy="20"
        [attr.r]="radius()"
        [attr.stroke-width]="stroke()"
        [attr.stroke-linecap]="linecap()"
        pathLength="100"
        stroke-dasharray="100"
        [attr.stroke-dashoffset]="offset()"
      />
      @if (successAmount()) {
        <circle
          class="success"
          cx="20"
          cy="20"
          [attr.r]="radius()"
          [attr.stroke-width]="stroke()"
          [attr.stroke-linecap]="linecap()"
          pathLength="100"
          stroke-dasharray="100"
          [attr.stroke-dashoffset]="100 - successAmount()"
        />
      }
    </g>
  </svg>
} @else {
  <div class="track" aria-hidden="true" [attr.data-segments]="segmentCount()">
    <div
      class="fill"
      [style.transform]="amount() === null ? null : 'scaleX(' + amount()! / 100 + ')'"
    ></div>
    @if (successAmount()) {
      <div class="success" [style.inline-size.%]="successAmount()"></div>
    }
  </div>
}
@if (labelTemplate(); as template) {
  <div class="value-label">
    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="labelContext()" />
  </div>
} @else if (showLabel() && amount() !== null) {
  <span class="value-label">{{ amount() }}%</span>
}
