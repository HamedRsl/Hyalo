<div
  class="thumbnails"
  role="group"
  [attr.aria-label]="label()"
  [style.--hy-gallery-thumbnail-min]="thumbnailMinWidth()"
  [style.--hy-gallery-thumbnail-ratio]="thumbnailAspectRatio()"
  [style.--hy-gallery-thumbnail-gap]="thumbnailGap()"
>
  @for (image of images(); track $index; let i = $index) {
    <button type="button" [attr.aria-label]="openLabel() + ': ' + image.alt" (click)="open(i)">
      @if (thumbnailTemplate(); as template) {
        <ng-container
          [ngTemplateOutlet]="template"
          [ngTemplateOutletContext]="{ $implicit: image, index: i }"
        />
      } @else {
        <img [src]="image.thumbnail ?? image.src" alt="" loading="lazy" />
      }
    </button>
  }
</div>
