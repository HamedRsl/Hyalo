@if (hourFormat() === 'auto') {
  <input
    type="time"
    [id]="id()"
    [name]="name()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
    [value]="draft()"
    [min]="min()"
    [max]="max()"
    [step]="showSeconds() ? secondStep() : step()"
    (change)="change($event)"
  />
} @else {
  <div
    class="time-parts"
    role="group"
    [attr.aria-label]="label() || 'Time'"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
  >
    <select
      [id]="id()"
      [attr.aria-label]="hourLabel()"
      [disabled]="blocked()"
      [value]="shownHour()"
      (change)="editPart('hour', $event)"
    >
      @for (hour of hours(); track hour) {
        <option
          [value]="hour"
          [disabled]="isHourDisabled()(hourFormat() === '12' ? (hour % 12) + period() * 12 : hour)"
        >
          {{ hour }}
        </option>
      }
    </select>
    <select
      [attr.aria-label]="minuteLabel()"
      [disabled]="blocked()"
      [value]="parts()[1]"
      (change)="editPart('minute', $event)"
    >
      @for (minute of minutes(); track minute) {
        <option [value]="minute" [disabled]="isMinuteDisabled()(parts()[0], minute)">
          {{ minute }}
        </option>
      }
    </select>
    @if (showSeconds()) {
      <select
        [attr.aria-label]="secondLabel()"
        [disabled]="blocked()"
        [value]="parts()[2]"
        (change)="editPart('second', $event)"
      >
        @for (second of seconds(); track second) {
          <option [value]="second" [disabled]="isSecondDisabled()(parts()[0], parts()[1], second)">
            {{ second }}
          </option>
        }
      </select>
    }
    @if (hourFormat() === '12') {
      <select
        [attr.aria-label]="meridianLabel()"
        [disabled]="blocked()"
        [value]="period()"
        (change)="editPart('period', $event)"
      >
        <option value="0">{{ meridianLabels()[0] }}</option>
        <option value="1">{{ meridianLabels()[1] }}</option>
      </select>
    }
  </div>
  @if (name()) {
    <input type="hidden" [name]="name()" [value]="value()" [disabled]="effectiveDisabled()" />
  }
}
@if (choices().length) {
  <div class="chips" role="group" [attr.aria-label]="label() || 'Time slots'">
    @for (slot of choices(); track slot.value) {
      <button
        type="button"
        [disabled]="blocked() || slot.blocked"
        [attr.aria-pressed]="draft() === slot.value"
        (click)="choose(slot.value)"
      >
        {{ slot.label ?? slot.value }}
      </button>
    }
  </div>
}
@if (confirmSelection()) {
  <button
    type="button"
    [disabled]="blocked() || (!!draft() && !available(draft()))"
    (click)="confirm()"
  >
    {{ confirmLabel() }}
  </button>
}
<ng-container
  [ngTemplateOutlet]="footerTemplate() ?? null"
  [ngTemplateOutletContext]="{ $implicit: this, draft: draft() }"
/>
