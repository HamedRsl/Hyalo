<input type="time" [id]="id()" [name]="name()" [disabled]="disabled()" [required]="required()" [readOnly]="readonly()" [attr.aria-label]="label() || null" [attr.aria-labelledby]="field?.labelId ?? null" [attr.aria-describedby]="describedBy()" [attr.aria-invalid]="showsError() || null" [value]="value()" [min]="min()" [max]="max()" [step]="step()" (change)="change($event)" />
@if (choices().length) { <div class="chips" role="group" [attr.aria-label]="label() || 'Time slots'">
@for (slot of choices(); track slot.value) { <button type="button" [disabled]="blocked() || slot.blocked" [attr.aria-pressed]="value() === slot.value" (click)="choose(slot.value)">{{ slot.label ?? slot.value }}</button> }
</div> }
