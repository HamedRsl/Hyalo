<nav [attr.aria-label]="label()">
  <ol>
    @for (item of items(); track $index; let last = $last) {
      <li>
        @if (item.href && !last) {
          <a [href]="item.href">{{ item.label }}</a>
        } @else {
          <span [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
        }
        @if (!last) {
          <span class="separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
