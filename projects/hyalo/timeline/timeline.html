<span class="dot" aria-hidden="true">
  @if (markerTemplate(); as template) {
    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="context" />
  }
</span>
@if (oppositeTemplate(); as template) {
  <div class="opposite">
    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="context" />
  </div>
}
@if (date()) {
  <time [attr.datetime]="dateTime()">{{ date() }}</time>
}
<strong>{{ heading() }}</strong>
<div><ng-content /></div>
