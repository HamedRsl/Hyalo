<div class="frame" [style.aspect-ratio]="ratio()">
  <img [src]="after()" [alt]="afterAlt()" draggable="false" />
  <img
    class="before"
    [src]="before()"
    [alt]="beforeAlt()"
    [style.clip-path]="clip()"
    draggable="false"
  />
  <span
    class="handle"
    aria-hidden="true"
    [class.vertical]="vertical()"
    [style.inset-inline-start.%]="vertical() ? null : position()"
    [style.inset-block-end.%]="vertical() ? position() : null"
    ><span>‖</span></span
  >
</div>
<label [for]="id">{{ label() }}: {{ position() }}%</label>
<input
  [id]="id"
  type="range"
  [class.vertical]="vertical()"
  [attr.aria-orientation]="orientation()"
  min="0"
  max="100"
  step="1"
  [value]="position()"
  (input)="change($event)"
/>
