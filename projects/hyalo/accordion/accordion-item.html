<div class="hy-accordion__heading" role="heading" [attr.aria-level]="headingLevel()">
  <button
    type="button"
    class="hy-accordion__trigger"
    ngAccordionTrigger
    [panel]="panel"
    [(expanded)]="expanded"
    [disabled]="disabled() || toggleTrigger() === 'manual'"
  >
    <span class="hy-accordion__label">
      {{ heading() }}
      <ng-content select="[hyAccordionHeading]" />
    </span>
    @if (!hideIcon()) {
      @if (customIcon(); as icon) {
        <ng-container [ngTemplateOutlet]="icon.template" [ngTemplateOutletContext]="{ $implicit: expanded() }" />
      } @else { <hy-icon class="hy-accordion__chevron" name="chevron-down" /> }
    }
  </button>
  <ng-content select="[hyAccordionActions]" />
</div>
<div ngAccordionPanel #panel="ngAccordionPanel" class="hy-accordion__panel">
  <div #body class="hy-accordion__body" (transitionend)="completed($event)">
    <div class="hy-accordion__content">
      <div class="hy-accordion__inner"><ng-content />
        @if (created()) { <ng-container [ngTemplateOutlet]="lazy()?.template ?? null" /> }
      </div>
    </div>
  </div>
</div>
