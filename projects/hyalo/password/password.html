<div class="control">
  <input
    [id]="id()"
    [name]="name()"
    [disabled]="disabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
    [type]="revealed() ? 'text' : 'password'"
    [value]="value()"
    [autocomplete]="autocomplete()"
    (input)="update($event)"
  />
  <button
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="revealed()"
    [attr.aria-controls]="id()"
    (click)="toggle()"
  >
    {{ revealed() ? 'Hide' : 'Show' }}
  </button>
</div>
@if (showStrength()) {
  <p class="message" role="status">
    Strength estimate: {{ strength() }}. This is not a security guarantee.
  </p>
}
