<div class="control">
  <input
    [id]="id()"
    [name]="name()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [readOnly]="readonly()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
    [type]="revealed() ? 'text' : 'password'"
    [value]="value()"
    [autocomplete]="autocomplete()"
    (input)="update($event)"
  />
  <button
    type="button"
    [disabled]="effectiveDisabled()"
    [attr.aria-label]="revealed() ? hideLabel() : showLabel()"
    [attr.aria-pressed]="revealed()"
    [attr.aria-controls]="id()"
    (click)="toggle()"
  >
    @if (visibilityTemplate(); as template) {
      <ng-container
        [ngTemplateOutlet]="template"
        [ngTemplateOutletContext]="{ $implicit: revealed() }"
      />
    } @else {
      {{ revealed() ? 'Hide' : 'Show' }}
    }
  </button>
</div>
@if (showStrength()) {
  <p class="message" role="status">
    @if (strengthTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="strengthContext()" />
    } @else {
      {{ strengthPrefix() }} {{ strength() }}. {{ strengthDisclaimer() }}
    }
  </p>
}
