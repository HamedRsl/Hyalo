<div
  class="chips"
  role="radiogroup"
  [attr.aria-label]="label() || 'Rating'"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  [attr.aria-required]="required() || null"
>
  @for (choice of choices(); track choice.value) {
    <label class="score"
      ><input
        type="radio"
        [id]="choice.value === 1 ? id() : id() + '-' + choice.value"
        [name]="name() || id()"
        [value]="choice.value"
        [checked]="value() === choice.value"
        [disabled]="blocked()"
        [required]="required()"
        [attr.aria-label]="choice.text + ' out of ' + choices().length"
        (change)="choose($event)"
      /><span aria-hidden="true">{{ choice.text }}</span></label
    >
  }
</div>
