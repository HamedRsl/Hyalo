@if (icon()) {
  <div class="symbol"><hy-icon [name]="icon()!" /></div>
}
@switch (headingLevel()) {
  @case (3) {
    <h3>{{ heading() }}</h3>
  }
  @case (4) {
    <h4>{{ heading() }}</h4>
  }
  @case (5) {
    <h5>{{ heading() }}</h5>
  }
  @case (6) {
    <h6>{{ heading() }}</h6>
  }
  @default {
    <h2>{{ heading() }}</h2>
  }
}
@if (description()) {
  <p>{{ description() }}</p>
}
<div class="actions"><ng-content /></div>
