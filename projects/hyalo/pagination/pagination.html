<nav [attr.aria-label]="label()">
  <button
    type="button"
    [attr.aria-label]="previousLabel()"
    [disabled]="disabled() || current() === 1"
    (click)="go(current() - 1)"
  >
    <span aria-hidden="true" class="arrow">‹</span>
  </button>
  <ng-content select="[hyPaginationStart]" />
  @if (showLinks()) { @for (item of pages(); track $index) {
    @if (item) {
      <button
        type="button"
        [attr.aria-label]="pageLabel()(item.label)"
        [disabled]="disabled()"
        [attr.aria-current]="item.value === current() ? 'page' : null"
        (click)="go(item.value)"
      >
        {{ item.label }}
      </button>
    } @else {
      <span aria-hidden="true">…</span>
    }
  }
  }
  <button
    type="button"
    [attr.aria-label]="nextLabel()"
    [disabled]="disabled() || current() === pageCount()"
    (click)="go(current() + 1)"
  >
    <span aria-hidden="true" class="arrow">›</span>
  </button>
  @if (pageSizes().length) { <span>{{ pageSizeLabel() }}</span><hy-select compact [label]="pageSizeLabel()" [disabled]="disabled()" [options]="pageSizeOptions()" [value]="pageSize()" popupWidth="6rem" (valueChange)="selectPageSize($event)" /> }
  @if (showJump()) { <label>{{ jumpLabel() }}<input type="number" min="1" [max]="pageCount()" [value]="current()" [disabled]="disabled()" (change)="go(+$any($event.target).value)" /></label> }
  @if (reportTemplate(); as template) { <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="report()" /> }
  <ng-content select="[hyPaginationEnd]" />
</nav>
