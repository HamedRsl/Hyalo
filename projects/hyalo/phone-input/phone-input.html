@if (countries().length) {
  <input
    type="search"
    [attr.aria-label]="countrySearchLabel()"
    [disabled]="blocked()"
    [value]="countryQuery()"
    (input)="countryQuery.set($any($event.target).value)"
  />
  <select
    [attr.aria-label]="countryLabel()"
    [disabled]="blocked()"
    [value]="country()"
    (change)="chooseCountry($event)"
  >
    @for (item of filteredCountries(); track item.code) {
      <option [value]="item.code">{{ item.name }} +{{ item.dialCode }}</option>
    }
  </select>
}
<input
  type="tel"
  autocomplete="tel-national"
  dir="ltr"
  [id]="id()"
  [name]="name()"
  [disabled]="effectiveDisabled()"
  [required]="required()"
  [readOnly]="readonly()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  [value]="display()"
  [attr.pattern]="countryPattern() || null"
  (beforeinput)="beforeDelete($event)"
  (input)="update($event)"
  (compositionend)="update($event)"
/>
<p class="message">{{ currentCountry().example }}</p>
