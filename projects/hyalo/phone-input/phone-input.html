<input
  type="tel"
  autocomplete="tel-national"
  dir="ltr"
  [id]="id()"
  [name]="name()"
  [disabled]="disabled()"
  [required]="required()"
  [readOnly]="readonly()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="showsError() || null"
  [value]="display()"
  pattern="09[0-9]{2} [0-9]{3} [0-9]{4}"
  (beforeinput)="beforeDelete($event)"
  (input)="update($event)"
  (compositionend)="update($event)"
/>
<p class="message">
  Iranian mobile number, for example 0912 345 6789. +98 and Persian digits are accepted.
</p>
