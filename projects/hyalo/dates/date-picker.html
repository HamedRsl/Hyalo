<div class="control" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input
    type="text"
    inputmode="numeric"
    [id]="id()"
    [name]="name()"
    [disabled]="effectiveDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.aria-label]="label() || null"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="error() ? id() + '-error' : describedBy()"
    [attr.aria-invalid]="showsError() || !!error() || null"
    [value]="draft()"
    placeholder="YYYY/MM/DD"
    (change)="edit($event)"
    (compositionend)="edit($event)"
  />
  <button
    type="button"
    class="calendar-action" [attr.aria-label]="calendarLabel()" [title]="calendarLabel()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [disabled]="blocked()"
    (click)="show()"
  >
    <hy-icon name="calendar" size="1.15rem" />
  </button>
</div>
@if (display()) {
  <p class="message">{{ display() }}</p>
}
@if (error()) {
  <p [id]="id() + '-error'" class="message error" role="alert">{{ error() }}</p>
}
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="touchUi() ? touchPositions : positions"
  [cdkConnectedOverlayPush]="!touchUi()"
  [cdkConnectedOverlayViewportMargin]="12"
  [cdkConnectedOverlayHasBackdrop]="touchUi()"
  cdkConnectedOverlayBackdropClass="cdk-overlay-dark-backdrop"
  (backdropClick)="close()"
  (detach)="detached()"
  (attach)="attached()"
  (overlayOutsideClick)="close(false)"
  (overlayKeydown)="keys($event)"
>
  <div
    #datePanel
    class="date-panel"
    tabindex="-1"
    [attr.data-touch]="touchUi() || null"
    [style.inline-size]="
      calendarOptions().months && calendarOptions().months! > 1 ? 'min(90vw, 72rem)' : null
    "
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="label() || dialogLabel()"
    cdkTrapFocus
  >
    <hy-calendar
      [labels]="calendarOptions().labels ?? defaultCalendarLabels"
      [months]="calendarOptions().months ?? 1"
      [view]="calendarOptions().view ?? 'month'"
      [firstDayOfWeek]="calendarOptions().firstDayOfWeek"
      [showWeekNumbers]="calendarOptions().showWeekNumbers ?? false"
      [outsideDays]="calendarOptions().outsideDays ?? 'visible'"
      [cellClass]="calendarOptions().cellClass ?? defaultCellClass"
      [cellTemplate]="calendarOptions().cellTemplate"
      [headerTemplate]="calendarOptions().headerTemplate"
      [comparisonRange]="calendarOptions().comparisonRange"
      [value]="(confirmation() ? pendingDate() : value()) ?? undefined"
      (selected)="pick($event)"
      [adapter]="adapter()"
      [locale]="locale()"
      [min]="min()"
      [max]="max()"
      [referenceDate]="referenceDate()"
      [isDateDisabled]="isDateDisabled()"
    />
    @if (confirmation()) {
      <button type="button" data-date-apply [disabled]="!canApply()" (click)="apply()">
        {{ applyLabel() }}
      </button>
      <button type="button" data-date-cancel (click)="cancel()">{{ cancelLabel() }}</button>
    } @else {
      <button class="calendar-action close-calendar" type="button" [attr.aria-label]="closeLabel()" [title]="closeLabel()" (click)="close()"><hy-icon name="x" size="1.15rem" /></button>
    }
  </div>
</ng-template>
