@if (sharedCalendar()) {
  <hy-calendar
    [labels]="calendarOptions().labels ?? defaultCalendarLabels"
    [months]="calendarOptions().months ?? 1"
    [view]="calendarOptions().view ?? 'month'"
    [firstDayOfWeek]="calendarOptions().firstDayOfWeek"
    [showWeekNumbers]="calendarOptions().showWeekNumbers ?? false"
    [outsideDays]="calendarOptions().outsideDays ?? 'visible'"
    [cellClass]="calendarOptions().cellClass ?? defaultCellClass"
    [cellTemplate]="calendarOptions().cellTemplate"
    [headerTemplate]="calendarOptions().headerTemplate"
    [comparisonRange]="calendarOptions().comparisonRange"
    [rangeMode]="true"
    [range]="value()"
    (rangeChange)="changeRange($event)"
    (rangePreview)="rangePreview.emit($event)"
    [rangeStrategy]="rangeStrategy()"
    [minRangeDays]="minRangeDays()"
    [maxRangeDays]="maxRangeDays()"
    [adapter]="adapter()"
    [locale]="locale()"
    [disabled]="blocked()"
    [min]="minDate()"
    [max]="maxDate()"
    [referenceDate]="referenceDate()"
    [isDateDisabled]="isDateDisabled()"
  />
} @else {
  <div
    class="range"
    role="group"
    [id]="id()"
    [attr.aria-label]="label() || 'Date range'"
    [attr.aria-labelledby]="field?.labelId ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showsError() || null"
  >
    <hy-field [label]="startLabel()"
      ><hy-date-picker
        [value]="start()"
        (valueChange)="changeStart($event)"
        [disabled]="effectiveDisabled()"
        [readonly]="readonly()"
        [required]="required()"
        [adapter]="adapter()"
        [locale]="locale()"
        [min]="minDate()"
        [max]="maxDate()"
        [referenceDate]="referenceDate()"
        [isDateDisabled]="isDateDisabled()"
    /></hy-field>
    <hy-field [label]="endLabel()"
      ><hy-date-picker
        [value]="value()?.end ?? null"
        (valueChange)="changeEnd($event)"
        [disabled]="effectiveDisabled() || !start()"
        [readonly]="readonly()"
        [required]="required()"
        [adapter]="adapter()"
        [locale]="locale()"
        [min]="start() ?? minDate()"
        [max]="maxDate()"
        [referenceDate]="start() ?? referenceDate()"
        [isDateDisabled]="isDateDisabled()"
    /></hy-field>
  </div>
}
