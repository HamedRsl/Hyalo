<header>
  <div class="brand"><ng-content select="[hySidebarBrand]" /></div>
  <button
    type="button"
    [attr.aria-label]="collapsed() ? expandLabel() : collapseLabel()"
    [attr.aria-expanded]="!collapsed()"
    (click)="collapsed.update(toggle)"
  >
    <svg
      viewBox="0 0 24 24"
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      aria-hidden="true"
    >
      <rect x="3" y="4" width="18" height="16" rx="3" />
      <path d="M9 4v16" />
    </svg>
  </button>
</header>
<nav [attr.aria-label]="label()"><ng-content /></nav>
<footer><ng-content select="[hySidebarFooter]" /></footer>
