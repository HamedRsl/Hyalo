<fieldset
  [id]="id()"
  [disabled]="effectiveDisabled()"
  [attr.aria-label]="label() || null"
  [attr.aria-labelledby]="field?.labelId ?? null"
  [attr.aria-describedby]="descriptions()"
  [attr.aria-invalid]="showsError() || !!validationError() || null"
>
  <div class="controls">
    @if (panelMode() !== 'time') {
      <hy-field [label]="dateLabel()">
        <hy-date-picker
          [label]="dateLabel()"
          [value]="draft().date"
          (valueChange)="editDate($event)"
          [adapter]="adapter()"
          [calendarLabel]="calendarLabel()"
          [locale]="locale()"
          [referenceDate]="referenceDate()"
          [min]="minDate()"
          [max]="maxDate()"
          [isDateDisabled]="isDateDisabled()"
          [disabled]="effectiveDisabled()"
          [readonly]="readonly()"
        />
      </hy-field>
    }
    @if (panelMode() !== 'date') {
      <hy-field [label]="timeLabel()">
        <hy-time-picker
          [label]="timeLabel()"
          [value]="draft().time"
          (valueChange)="editTime($event)"
          [step]="timeStep()"
          [hourFormat]="hourFormat()"
          [showSeconds]="showSeconds()"
          [hourStep]="hourStep()"
          [minuteStep]="minuteStep()"
          [secondStep]="secondStep()"
          [isHourDisabled]="isHourDisabled()"
          [isMinuteDisabled]="isMinuteDisabled()"
          [isSecondDisabled]="isSecondDisabled()"
          [disabled]="effectiveDisabled()"
          [readonly]="readonly()"
        />
      </hy-field>
    }
  </div>
  <p class="zone">{{ timeZone() }}</p>
  @if (validationError()) {
    <p class="error" [id]="errorId">{{ validationError() }}</p>
  }
  <div class="actions">
    <button
      hyButton
      type="button"
      [disabled]="blocked() || candidate() === null || !!validationError()"
      (click)="apply()"
    >
      {{ applyLabel() }}
    </button>
    <button hyButton variant="ghost" type="button" [disabled]="blocked()" (click)="cancel()">
      {{ cancelLabel() }}
    </button>
    @if (clearLabel()) {
      <button
        hyButton
        variant="ghost"
        type="button"
        [disabled]="blocked() || (value() === null && !draft().date && !draft().time)"
        (click)="clear()"
      >
        {{ clearLabel() }}
      </button>
    }
  </div>
</fieldset>
@if (name()) {
  <input type="hidden" [name]="name()" [value]="value() ?? ''" [disabled]="effectiveDisabled()" />
}
